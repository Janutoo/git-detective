[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-detective"
version = "0.1.0"
description = "Analyze Git history to find code hotspots and contributor activity."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kamil Janusz" }]
keywords = ["git", "code-analysis", "hotspots", "churn", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "gitpython>=3.1.43",
    "pathspec>=0.12",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
api = [
    # 0.132 enables strict_content_type by default, which protects a local,
    # unauthenticated API against cross-site requests without a JSON header.
    "fastapi>=0.132",
    "uvicorn>=0.30",
]
dev = [
    "git-detective[api]",
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
git-detective = "git_detective.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/git_detective"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# Typer declares CLI options via function defaults, which B008 would flag.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
